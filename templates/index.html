<!doctype html>
<html>
  <head>
    <title>Fake News Detection</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>📰 Fake News Detection (PhoBERT)</h1>

      <form method="POST">
        <textarea
          name="text"
          placeholder="Nhập nội dung tin tức..."
          required
        ></textarea>
        <button type="submit">Dự đoán</button>
      </form>

      {% if result %}
      <div class="result">Kết quả: <strong>{{ result }}</strong></div>
      {% endif %}
    </div>
  </body>
</html>
